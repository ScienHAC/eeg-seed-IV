[project]
name = "eeg-backend"
version = "0.1.0"
description = "FastAPI backend for EEG Emotion Recognition Dashboard - processes SEED-IV .mat files"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "numpy>=1.26.0,<2.2.0",
    "pandas>=2.0.3",
    "scipy>=1.11.4",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "requests>=2.32.4",
]
